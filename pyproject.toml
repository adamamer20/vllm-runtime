[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-runtime"
version = "0.1.0"
description = "HTTP-first OpenAI-compatible vLLM runtime with managed/external server lifecycle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11.7",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.11",
]

[project.scripts]
vllm-runtime-health = "vllm_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
